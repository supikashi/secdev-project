name: SAST & Secrets

on:
  push:
    branches: [main, 'p10-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Semgrep
        run: |
          pip install -q semgrep==1.95.0
          mkdir -p EVIDENCE/P10
          semgrep scan --config=p/ci --config=security/semgrep/rules.yml --sarif -o EVIDENCE/P10/semgrep.sarif || true

      - name: Run Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --config=security/.gitleaks.toml --report-format=json --report-path=EVIDENCE/P10/gitleaks.json || true

      - name: Generate summary
        run: |
          cat > EVIDENCE/P10/sast_summary.md << 'EOF'
          # SAST & Secrets Scanning Summary

          **Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Semgrep Findings

          See `semgrep.sarif` for full SARIF report.

          Review findings by severity:
          - **ERROR:** Security issues requiring immediate attention
          - **WARNING:** Potential issues to review
          - **INFO:** Code quality suggestions

          ## Gitleaks Findings

          See `gitleaks.json` for detailed secrets scan results.

          Check for exposed credentials, tokens, and API keys.

          ## Artifacts

          - SAST Report: `EVIDENCE/P10/semgrep.sarif`
          - Secrets Report: `EVIDENCE/P10/gitleaks.json`
          - This Summary: `EVIDENCE/P10/sast_summary.md`
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-secrets-evidence
          path: EVIDENCE/P10/
          retention-days: 90
