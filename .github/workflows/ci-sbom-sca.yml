name: SBOM & SCA
on:
  push:
    branches:
      - main
      - 'p09-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        timeout-minutes: 3
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.17.0

      - name: Generate SBOM
        timeout-minutes: 5
        run: |
          syft dir:. -o cyclonedx-json=EVIDENCE/P09/sbom.json
          echo "SBOM generated at EVIDENCE/P09/sbom.json"

      - name: Install Grype
        timeout-minutes: 3
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.104.2

      - name: Run SCA
        timeout-minutes: 5
        run: |
          grype sbom:EVIDENCE/P09/sbom.json -o json > EVIDENCE/P09/sca_report.json || true
          grype sbom:EVIDENCE/P09/sbom.json -o table || true
          echo "SCA report generated at EVIDENCE/P09/sca_report.json"

      - name: Generate summary
        timeout-minutes: 2
        run: |
          cat > EVIDENCE/P09/sca_summary.md << EOF
          # SCA Summary

          **Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Severity Distribution

          See workflow logs for detailed table output or review \`sca_report.json\` for complete data.

          To be filled after first scan:
          - **Critical:** TBD
          - **High:** TBD
          - **Medium:** TBD
          - **Low:** TBD

          ## Key Findings

          Review \`sca_report.json\` for full vulnerability details. Focus on Critical and High severity items.

          ## Next Steps

          1. Review Critical and High severity vulnerabilities
          2. Check if updates are available for affected packages
          3. Create waivers for accepted risks in \`policy/waivers.yml\`
          4. Track remediation in issues/PRs

          ## Artifacts

          - Full SBOM: \`EVIDENCE/P09/sbom.json\`
          - SCA Report: \`EVIDENCE/P09/sca_report.json\`
          - This Summary: \`EVIDENCE/P09/sca_summary.md\`
          - Table output in workflow logs
          EOF
          echo "Summary generated at EVIDENCE/P09/sca_summary.md"

      - name: Upload SBOM & SCA artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-sca-evidence
          path: EVIDENCE/P09/
          retention-days: 90

      - name: Display summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "SBOM & SCA Scan Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          cat EVIDENCE/P09/sca_summary.md || echo "Summary not available"
