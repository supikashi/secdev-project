apiVersion: apps/v1
kind: Deployment
metadata:
  name: supikashi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supikashi
  template:
    metadata:
      labels:
        app: supikashi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: app
        image: supikashi-app:1.0
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://user:pass@db:5432"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
